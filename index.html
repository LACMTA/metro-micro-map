<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Branded Esri Map</title>

    <!-- Load Leaflet from CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <!-- Esri Leaflet and Esri Leaflet Vector -->
    <script src="https://unpkg.com/esri-leaflet/dist/esri-leaflet.js"></script>
    <script src="https://unpkg.com/esri-leaflet-vector@4/dist/esri-leaflet-vector.js"></script>

    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        // This "Map Template API Key" expires on 11/1/2026 (1 year expiration limit) and is limited to use on Metro GitHub pages
        const ESRI_KEY =  "AAPTa8rDnsmBWfSSL8bkW6WkjSA..OCUdQlXO8SnxHYLP7xNdDwZhlvMrkTnBabET9CrUUKI4RfPLEz5aUFPt53cfDV5t2XtsO6wTGU0OoHNK2Zmc2twKGJZj9csm4-dSWjmW4kBz4qQSW2CZzFDOWkihXsCT3JdEsSGTi2CHHyBwXp5APARzNhuBHz1Th1f1VpbG2DrqnEetcw0qGc2vgzEJrHTgHFfdLeZ-qbwDGKOgm0RIflWSKnwBD9J-A696etj4FMWARWLqcmNNE1sQoDHEjz7HMXABAT1_mnx5UmlP";

        // Metro Branded Basemap:
        const basemapEnum = "65aff2873118478482ec3dec199e9058";
        
        // Existing Metro Rail and Busway:
        // https://lametro.maps.arcgis.com/home/item.html?id=17fc6859e51e4188b4a4120fcbd2e43d
        // const mapImagery = 'https://tiles.arcgis.com/tiles/TNoJFjk1LsD45Juj/arcgis/rest/services/Map_RGB_Vector_Offset_RC5/MapServer';


        // Metro Micro zones:
        const zones = [
            {
                'name': 'Highland Park/Eagle Rock/Glendale',
                'data': 'data/20260615093710_HighlandPark_Eagle Rock_Glendale_ZoneAreaExport.geojson',
                'color': '#0076BF'
            },{
                'name': 'LAX/Inglewood',
                'data':  'data/20260615093722_LAX_Inglewood_ZoneAreaExport.geojson',
                'color': '#5DA542'
            },{
                'name': 'El Monte',
                'data':  'data/20260615093787_ElMonte_ZoneAreaExport.geojson',
                'color': '#A25CA9'
            },{
                'name': 'Altadena/Pasadena/Sierra Madre',
                'data':  'data/20260615093815_Altadena_Pasadena_SierraMadre_ZoneAreaExport.geojson',
                'color': '#45A9C5'
            },{
                'name': 'UCLA/Westwood/VA Medical Center',
                'data':  'data/20260615093842_UCLA_Westwood_VAMedical Center_ZoneAreaExport.geojson',
                'color': '#F54F06'
            },{
                'name': 'Watts/Compton',
                'data':  'data/20260615093882_Watts_Compton_ZoneAreaExport.geojson',
                'color': '#E03862'
            },{
                'name': 'North Hollywood/Burbank',
                'data':  'data/20260615093979_NorthHollywood_Burbank_ZoneAreaExport.geojson',
                'color': '#53C3F1'
            },{
                'name': 'Northwest San Fernando Valley',
                'data':  'data/20260721131063_NorthwestSan Fernando Valley new test_ZoneAreaExport.geojson',
                'color': '#F99E23'
            }
        ];

        const map = L.map('map', {
            minZoom: 2
        }).setView([34.00095151499077, -118.25133692966446], 11);

        // Add the Metro Branded Basemap
        L.esri.Vector.vectorBasemapLayer(basemapEnum, {
            apiKey: ESRI_KEY
        }).addTo(map);

        // Add the Metro Rail and Busway Layer
        // let metroLayer = new L.esri.TiledMapLayer({
        //     url: mapImagery,
        //     apiKey: ESRI_KEY
        // });
        // 
        // metroLayer.addTo(map);

        // Add Metro Micro zones
        zones.forEach(zone => {
            fetch(zone.data)
                .then(response => response.json())
                .then(geojsonData => {
                    console.log('GeoJSON successfully loaded: ' + zone.name);

                    let geojsonFeature = geojsonData.features[0];
                    
                    let geojsonLayer = L.geoJSON(geojsonFeature);

                    geojsonLayer.setStyle({
                        color: zone.color
                    });

                    geojsonLayer.addTo(map);
                })
                .catch(error => console.error('Error loading GeoJSON: ' + zone.name));
        })




    </script>
</body>
</html>
